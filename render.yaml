# ==============================================================================
# RENDER BLUEPRINT CONFIGURATION
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # Mode 1: Site Statique (Recommandé - 100% Gratuit, Illimité, Pas de mise en veille)
  - type: web
    name: sheikah-translator
    runtime: static
    buildCommand: ""
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /letter/*
        name: Cache-Control
        value: public, max-age=604800, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=604800, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=604800, immutable
